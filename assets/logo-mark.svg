<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Chromotion">
  <defs>
    <linearGradient id="cm-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="0.5" stop-color="#4F6BFF"/>
      <stop offset="1" stop-color="#14C8EE"/>
    </linearGradient>
    <radialGradient id="cm-light" cx="0.25" cy="0.15" r="0.85">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.42"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cm-ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.82"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="30" fill="url(#cm-bg)"/>
  <rect width="128" height="128" rx="30" fill="url(#cm-light)"/>
  <rect x="1" y="1" width="126" height="126" rx="29" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="2"/>
  <!-- the C orbit: chrome + motion -->
  <path d="M89.5 38.5 A36 36 0 1 0 89.5 89.5" fill="none" stroke="url(#cm-ring)" stroke-width="13" stroke-linecap="round"/>
  <!-- a canvas inside the orbit -->
  <rect x="50" y="50" width="28" height="28" rx="8" fill="#FFFFFF" fill-opacity="0.95"/>
  <rect x="50" y="50" width="28" height="9" rx="4.5" fill="#4F6BFF" fill-opacity="0.35"/>
  <!-- motion trails leaving the opening -->
  <path data-detail="1" d="M98 56 H114" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="6" stroke-linecap="round"/>
  <path data-detail="1" d="M101 72 H112" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="6" stroke-linecap="round"/>
</svg>
