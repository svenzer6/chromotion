<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Sleeping tab</title>
    <link id="icon" rel="icon" href="data:," />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #eceef7;
        --glass: rgba(255, 255, 255, 0.55);
        --border: rgba(255, 255, 255, 0.7);
        --text: #0e1222;
        --muted: #555e72;
        --accent: #4f46e5;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #080914;
          --glass: rgba(22, 24, 40, 0.55);
          --border: rgba(255, 255, 255, 0.1);
          --text: #eef0f8;
          --muted: #959cb2;
          --accent: #9b9bff;
        }
      }
      html,
      body {
        height: 100%;
        margin: 0;
        color: var(--text);
        font: 14px/1.45 system-ui, -apple-system, 'Segoe UI', sans-serif;
        background:
          radial-gradient(40% 35% at 15% 10%, rgba(79, 107, 255, 0.4), transparent 70%),
          radial-gradient(40% 35% at 90% 20%, rgba(139, 92, 246, 0.32), transparent 70%),
          radial-gradient(45% 40% at 80% 95%, rgba(20, 200, 238, 0.3), transparent 70%),
          var(--bg);
      }
      main {
        height: 100%;
        display: grid;
        place-items: center;
        padding: 16px;
        box-sizing: border-box;
      }
      button {
        all: unset;
        cursor: pointer;
        display: grid;
        justify-items: center;
        gap: 8px;
        max-width: 520px;
        padding: 30px 34px;
        border-radius: 20px;
        background: var(--glass);
        -webkit-backdrop-filter: blur(24px) saturate(170%);
        backdrop-filter: blur(24px) saturate(170%);
        border: 1px solid var(--border);
        box-shadow: 0 20px 50px rgba(36, 40, 90, 0.18);
        text-align: center;
      }
      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }
      #favicon {
        width: 32px;
        height: 32px;
      }
      strong {
        font-size: 16px;
        overflow-wrap: anywhere;
      }
      span {
        color: var(--muted);
        overflow-wrap: anywhere;
      }
      em {
        font-style: normal;
        color: var(--accent);
        font-weight: 600;
      }
      footer {
        position: fixed;
        bottom: 14px;
        left: 0;
        right: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        color: var(--muted);
      }
      footer img {
        width: 14px;
        height: 14px;
      }
    </style>
  </head>
  <body>
    <main>
      <button id="wake" type="button">
        <img id="favicon" alt="" />
        <strong id="title">Sleeping tab</strong>
        <span id="url"></span>
        <em>Loads when you open it</em>
      </button>
    </main>
    <footer><img src="/icons/logo-mark.svg" alt="" /> Chromotion · by Burhan Celebi</footer>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
